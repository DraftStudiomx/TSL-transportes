# Publica el sitio en el cPanel de hosting-mexico.net (tslmexico.com) por FTP.
# Corre en cada push a main y cada vez que el cliente publica en Sanity.
#
# Desactivado hasta configurar el hosting. Para activarlo, en GitHub → Settings:
#   Secrets → Actions:  FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables → Actions: CPANEL_ENABLED = true
name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

concurrency:
  group: cpanel
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CPANEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
          # No borra archivos del servidor que no sean del sitio (correo, .well-known, etc.)
          dangerous-clean-slate: false
